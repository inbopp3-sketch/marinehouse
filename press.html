<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0b1e38">
  <meta name="description" content="마린하우스코리아 홈페이지가 현재 점검 중입니다. 문의는 대표번호로 연락해 주세요.">
  <title>홈페이지 점검 중 | 마린하우스코리아</title>
  <link rel="icon" href="/assets/images/favicon.png">
  <style>
    :root { color-scheme: light; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; color: #172c46; background: radial-gradient(ellipse 70% 60% at 50% -8%, #e7f1ff 0%, transparent 75%), #f5f8fc; }
    .page { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; }
    .card { width: min(100%, 640px); text-align: center; }
    .logo { width: 88px; height: 88px; display: block; margin: 0 auto 20px; border-radius: 20px; object-fit: contain; background: #fff; box-shadow: 0 12px 35px #163d681c; }
    .brand { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.045em; }
    .en { margin: 5px 0 42px; color: #79899d; font-size: 11px; font-weight: 700; letter-spacing: .2em; }
    .symbol { width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 28px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #123b6d, #0b203e); box-shadow: 0 16px 34px #0b376b2b; }
    .symbol svg { width: 36px; height: 36px; }
    h1 { margin: 0; color: #0b2444; font-weight: 850; font-size: clamp(34px, 7vw, 48px); line-height: 1.28; letter-spacing: -.06em; }
    .description { color: #62738a; font-size: 17px; line-height: 1.9; margin: 22px 0 0; word-break: keep-all; }
    .rule { height: 1px; width: min(100%, 400px); margin: 42px auto 27px; background: #dce5f0; }
    .contact-label { margin: 0 0 12px; color: #52667e; font-size: 13px; letter-spacing: .02em; font-weight: 700; }
    .contacts { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .contacts a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 17px; background: #fff; border: 1px solid #dce6f1; border-radius: 10px; color: #163c70; text-decoration: none; font-weight: 800; font-size: 15px; }
    .contacts a:hover, .contacts a:focus-visible { border-color: #88addb; background: #eaf3ff; }
    footer { color: #99a6b6; margin-top: 64px; font-size: 12px; letter-spacing: .04em; }
    @media (max-width: 500px) { .page { padding: 38px 20px; } .en { margin-bottom: 36px; } .description { font-size: 15px; } .contacts { flex-direction: column; align-items: center; } .contacts a { width: min(100%, 250px); } }
  </style>
</head>
<body>
  <main class="page">
    <div class="card">
      <img class="logo" src="/assets/images/logo-full.png" alt="마린하우스코리아 로고">
      <p class="brand">마린하우스코리아</p>
      <p class="en">MARINE HOUSE KOREA</p>
      <div class="symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.65 5.65l2.13 2.13M16.22 16.22l2.13 2.13M18.35 5.65l-2.13 2.13M7.78 16.22l-2.13 2.13"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </div>
      <h1>홈페이지 점검 중</h1>
      <p class="description">현재 홈페이지를 점검하고 있습니다.<br>보다 안정적인 서비스로 다시 찾아뵙겠습니다.<br>이용에 불편을 드려 죄송합니다.</p>
      <div class="rule"></div>
      <p class="contact-label">문의 전화</p>
      <div class="contacts">
        <a href="tel:01076992187" aria-label="010-7699-2187 전화 연결">010-7699-2187</a>
        <a href="tel:01056092187" aria-label="010-5609-2187 전화 연결">010-5609-2187</a>
      </div>
      <footer>© MARINE HOUSE KOREA</footer>
    </div>
  </main>
</body>
</html>
