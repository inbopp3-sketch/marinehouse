name: Update sales teams and press coverage

on:
  push:
    paths:
      - ".github/workflows/update-sales-teams-and-press.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update sales contacts and press page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')

          OFFICE_DISPLAY = '02-744-7779'
          OFFICE_TEL = '027447779'
          MAIN_DISPLAY = '1544-9187'
          MAIN_TEL = '15449187'
          SALES = [
              ('영업1팀', '010-5603-2187', '01056032187'),
              ('영업2팀', '010-5609-2187', '01056092187'),
              ('영업3팀', '010-8250-2187', '01082502187'),
              ('영업4팀', '010-7742-2187', '01077422187'),
          ]

          sales_footer = '''<div class="sales-team-list" data-sales-teams aria-label="영업팀 연락처">
                <p><strong>영업1팀</strong> <a href="tel:01056032187">010-5603-2187</a></p>
                <p><strong>영업2팀</strong> <a href="tel:01056092187">010-5609-2187</a></p>
                <p><strong>영업3팀</strong> <a href="tel:01082502187">010-8250-2187</a></p>
                <p><strong>영업4팀</strong> <a href="tel:01077422187">010-7742-2187</a></p>
              </div>'''

          support_sales = '''<div class="phone-consult-divider"><span>영업팀 선택</span></div>
              <div class="sales-team-grid" data-sales-teams aria-label="영업팀 전화번호">
                <a class="sales-team-link" href="tel:01056032187"><span>영업1팀</span><strong>010-5603-2187</strong></a>
                <a class="sales-team-link" href="tel:01056092187"><span>영업2팀</span><strong>010-5609-2187</strong></a>
                <a class="sales-team-link" href="tel:01082502187"><span>영업3팀</span><strong>010-8250-2187</strong></a>
                <a class="sales-team-link" href="tel:01077422187"><span>영업4팀</span><strong>010-7742-2187</strong></a>
              </div>
              <small>모바일에서 원하는 영업팀 번호를 누르면 전화 연결 화면이 열립니다.</small>'''

          compact_sales = '''<div data-sales-teams style="margin:18px auto 0;max-width:960px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;text-align:center">
              <strong style="width:100%">영업상담</strong>
              <a href="tel:01056032187">영업1팀 010-5603-2187</a>
              <a href="tel:01056092187">영업2팀 010-5609-2187</a>
              <a href="tel:01082502187">영업3팀 010-8250-2187</a>
              <a href="tel:01077422187">영업4팀 010-7742-2187</a>
            </div>'''

          def update_top_strip(text: str) -> str:
              pattern = re.compile(
                  r'(<div class="container top-strip-inner">\s*<span>.*?</span>\s*)<span>.*?</span>',
                  re.S,
              )
              return pattern.sub(
                  r'\1<span>회사전화 02-744-7779 · 대표번호 1544-9187 · 영업 1~4팀 상담 운영</span>',
                  text,
              )

          def update_footer(text: str) -> str:
              start = text.find('<footer')
              if start < 0:
                  return text
              end = text.find('</footer>', start)
              if end < 0:
                  return text
              end += len('</footer>')
              footer = text[start:end]

              footer = re.sub(r'\s*<div class="sales-team-list".*?</div>', '', footer, flags=re.S)
              footer = re.sub(
                  r'\s*<p>\s*(?:휴대전화|휴대폰)\s*:\s*<a[^>]*>.*?</a>\s*</p>',
                  '',
                  footer,
                  flags=re.S,
              )
              footer = re.sub(
                  r'\s*<p>\s*회사전화\s*:\s*<a[^>]*>.*?</a>\s*</p>',
                  '',
                  footer,
                  flags=re.S,
              )

              address_pattern = re.compile(r'(<h4>CONTACT</h4>\s*<p>주소:.*?</p>)', re.S)
              footer = address_pattern.sub(
                  r'\1\n      <p>회사전화: <a href="tel:027447779">02-744-7779</a></p>',
                  footer,
                  count=1,
              )

              rep_pattern = re.compile(
                  r'(<p>대표전화:\s*<a[^>]*>1544-9187</a></p>)',
                  re.S,
              )
              if rep_pattern.search(footer):
                  footer = rep_pattern.sub(r'\1\n      ' + sales_footer, footer, count=1)

              return text[:start] + footer + text[end:]

          def update_about_table(text: str) -> str:
              if '<table>' not in text or '<th>CEO</th>' not in text:
                  return text
              text = re.sub(
                  r'\s*<tr><th>(?:Mobile|Sales Team [1-4])</th><td>.*?</td></tr>',
                  '',
                  text,
                  flags=re.S,
              )
              sales_rows = '''
                <tr><th>Sales Team 1</th><td><a href="tel:01056032187">010-5603-2187</a></td></tr>
                <tr><th>Sales Team 2</th><td><a href="tel:01056092187">010-5609-2187</a></td></tr>
                <tr><th>Sales Team 3</th><td><a href="tel:01082502187">010-8250-2187</a></td></tr>
                <tr><th>Sales Team 4</th><td><a href="tel:01077422187">010-7742-2187</a></td></tr>'''
              marker = re.compile(
                  r'(<tr><th>Representative</th><td><a[^>]*>1544-9187</a></td></tr>)'
              )
              if marker.search(text):
                  text = marker.sub(r'\1' + sales_rows, text, count=1)
              return text

          def update_support(text: str) -> str:
              text = text.replace(
                  '장비 구매, 렌탈·리스, 매장 설치, 상품 보급, 유지관리 상담은 아래 번호로 연락해 주세요.',
                  '장비 구매, 렌탈·리스, 매장 설치, 상품 보급, 유지관리 상담은 대표번호 또는 담당 영업팀으로 연락해 주세요.',
              )
              pattern = re.compile(
                  r'<div class="phone-consult-divider">.*?<small>.*?</small>',
                  re.S,
              )
              if pattern.search(text):
                  text = pattern.sub(support_sales, text, count=1)
              return text

          def update_landing(text: str) -> str:
              if 'data-sales-teams' in text:
                  return text
              if '</footer>' in text:
                  return text.replace('</footer>', compact_sales + '\n  </footer>', 1)
              return text

          def normalize_sales_numbers(text: str) -> str:
              variants = {
                  r'010[\s.\-]*5603[\s.\-]*2187': ('010-5603-2187', '01056032187'),
                  r'010[\s.\-]*5609[\s.\-]*2187': ('010-5609-2187', '01056092187'),
                  r'010[\s.\-]*8250[\s.\-]*2187': ('010-8250-2187', '01082502187'),
                  r'010[\s.\-]*7742[\s.\-]*2187': ('010-7742-2187', '01077422187'),
              }
              for pattern, (display, digits) in variants.items():
                  text = re.sub(r'tel:\s*' + pattern, 'tel:' + digits, text, flags=re.I)
                  text = re.sub(r'(?<!\d)' + pattern + r'(?!\d)', display, text)
              return text

          changed = []
          for path in ROOT.rglob('*.html'):
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              original = path.read_text(encoding='utf-8')
              text = normalize_sales_numbers(original)
              text = update_top_strip(text)

              # Remove an old standalone company-phone paragraph that was accidentally placed outside the footer.
              text = re.sub(
                  r'</main>\s*<p>회사전화:\s*<a[^>]*>02-744-7779</a></p>\s*<footer',
                  '</main>\n<footer',
                  text,
                  flags=re.S,
              )

              if path.name == 'about.html' and path.parent == ROOT:
                  text = update_about_table(text)
              if path.name == 'support.html' and path.parent == ROOT:
                  text = update_support(text)

              if path.parent == ROOT or path.parent.name == 'press':
                  text = update_footer(text)
              elif path.parts[:1] in [('startup',), ('1',)]:
                  text = update_landing(text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Correct the official publication date for the adult-verification release.
          release_path = ROOT / 'press' / 'marinehouse-adult-verification-access-control-launch.html'
          if release_path.exists():
              original = release_path.read_text(encoding='utf-8')
              text = original.replace('2026-07-15', '2026-07-13').replace('2026.07.15', '2026.07.13')
              if text != original:
                  release_path.write_text(text, encoding='utf-8')
                  if str(release_path) not in changed:
                      changed.append(str(release_path))

          media_items = [
              {
                  'outlet': '호수뉴스',
                  'date': '2026-07-14',
                  'date_display': '2026.07.14',
                  'title': '마린하우스코리아, 성인 전용 무인 매장 출입 관리에 혁신을 가져오다',
                  'summary': '성인인증 키오스크와 출입문 관리 시스템의 작동 방식, 현장 맞춤 적용과 사후지원 계획을 소개한 기사입니다.',
                  'url': 'https://www.mimint.co.kr/bbs/view/news/S1N12/5477335',
              },
              {
                  'outlet': '뉴스와이어',
                  'date': '2026-07-13',
                  'date_display': '2026.07.13',
                  'title': '마린하우스코리아, 무인 성인인증 키오스크·출입문 관리 시스템 출시',
                  'summary': '성인 여부 확인과 출입문 제어를 연동한 신제품 출시 소식을 공식 배포한 보도자료입니다.',
                  'url': 'https://www.newswire.co.kr/newsRead.php?no=1038444',
              },
              {
                  'outlet': 'AI경기방송',
                  'date': '2026-07-13',
                  'date_display': '2026.07.13',
                  'title': '마린하우스코리아, 무인 성인인증 키오스크·출입문 관리 시스템 출시',
                  'summary': '무인매장의 성인 확인과 출입관리 효율을 높이는 시스템의 주요 기능과 적용 범위를 다룬 기사입니다.',
                  'url': 'https://www.kfm.co.kr/news/2026071365667',
              },
              {
                  'outlet': '영천뉴스24',
                  'date': '2026-07-13',
                  'date_display': '2026.07.13',
                  'title': '마린하우스코리아, 무인 성인인증 키오스크·출입문 관리 시스템 출시',
                  'summary': '뉴스와이어를 통해 배포된 성인인증 키오스크 출시 소식이 지역 언론에 게재됐습니다.',
                  'url': 'https://press.yc24.kr/newsRead.php?no=1038444',
              },
              {
                  'outlet': '뉴스와이어',
                  'date': '2026-06-09',
                  'date_display': '2026.06.09',
                  'title': '마린하우스코리아, 무인기기 토탈 솔루션 사업 확대… 아케이드·자동판매기 시장 공략',
                  'summary': '설계·제조·설치·운영지원·유지보수까지 연결한 무인기기 사업 확대와 주요 제품군을 소개한 보도자료입니다.',
                  'url': 'https://www.newswire.co.kr/newsRead.php?no=1036148',
              },
              {
                  'outlet': 'AI경기방송',
                  'date': '2026-06-09',
                  'date_display': '2026.06.09',
                  'title': '마린하우스코리아, 무인기기 토탈 솔루션 사업 확대… 아케이드·자동판매기 시장 공략',
                  'summary': '아케이드 게임기, 자동판매기, 무인 리테일 솔루션과 UFO LAB 사업 확대 계획을 다룬 기사입니다.',
                  'url': 'https://www.kfm.co.kr/news/2026060963918',
              },
          ]

          def media_cards() -> str:
              cards = []
              for item in media_items:
                  cards.append(f'''      <article class="press-card media-coverage-card">
                <div class="press-meta"><span>{item['outlet']}</span><time datetime="{item['date']}">{item['date_display']}</time></div>
                <h2>{item['title']}</h2>
                <p>{item['summary']}</p>
                <a class="press-link" href="{item['url']}" target="_blank" rel="noopener noreferrer">기사 원문 보기 ↗</a>
              </article>''')
              return '\n'.join(cards)

          press_path = ROOT / 'press.html'
          if press_path.exists():
              original = press_path.read_text(encoding='utf-8')
              text = original
              text = re.sub(
                  r'<title>.*?</title>',
                  '<title>언론보도·보도자료 | 마린하우스코리아(주)</title>',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'<meta name="description" content=".*?">',
                  '<meta name="description" content="마린하우스코리아의 최신 언론보도, 성인인증 키오스크 출시 기사, 무인기기 사업 소식과 회사 보도자료.">',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'<meta property="og:description" content=".*?">',
                  '<meta property="og:description" content="마린하우스코리아의 최신 언론 게재 기사와 회사 보도자료를 확인할 수 있습니다.">',
                  text,
                  count=1,
              )

              item_list = []
              for position, item in enumerate(media_items, 1):
                  item_list.append({
                      '@type': 'ListItem',
                      'position': position,
                      'url': item['url'],
                      'name': f"{item['outlet']} - {item['title']}",
                  })
              item_list.extend([
                  {
                      '@type': 'ListItem',
                      'position': len(item_list) + 1,
                      'url': 'https://www.marinehouse.kr/press/marinehouse-adult-verification-access-control-launch.html',
                      'name': '마린하우스코리아, 무인 성인인증 키오스크·출입문 관리 시스템 출시',
                  },
                  {
                      '@type': 'ListItem',
                      'position': len(item_list) + 2,
                      'url': 'https://www.marinehouse.kr/press/marinehouse-unmanned-support.html',
                      'name': '마린하우스코리아, 무인기기 공급·설치·유지관리 통합 지원 강화',
                  },
              ])
              schema = {
                  '@context': 'https://schema.org',
                  '@type': 'CollectionPage',
                  'name': '마린하우스코리아 언론보도 및 보도자료',
                  'url': 'https://www.marinehouse.kr/press.html',
                  'publisher': {
                      '@type': 'Organization',
                      'name': '마린하우스코리아(주)',
                      'url': 'https://www.marinehouse.kr/',
                  },
                  'mainEntity': {
                      '@type': 'ItemList',
                      'itemListElement': item_list,
                  },
              }
              schema_html = '<script type="application/ld+json">\n' + json.dumps(schema, ensure_ascii=False, indent=2) + '\n  </script>'
              text = re.sub(
                  r'<script type="application/ld\+json">.*?</script>',
                  schema_html,
                  text,
                  count=1,
                  flags=re.S,
              )

              new_main = f'''<main id="main">
            <section class="page-hero">
              <div class="container">
                <span class="kicker-light">PRESS & MEDIA</span>
                <h1>언론보도 · 보도자료</h1>
                <p>최근 확인된 언론 게재 기사와 마린하우스코리아의 주요 사업 소식을 최신순으로 정리했습니다.</p>
              </div>
            </section>

            <section class="section">
              <div class="container">
                <div class="section-head narrow">
                  <span>MEDIA COVERAGE</span>
                  <h2>최근 언론보도</h2>
                  <p>동일한 보도자료가 여러 언론 매체에 게재된 경우 매체별 원문을 함께 확인할 수 있습니다.</p>
                </div>
                <div class="press-list media-coverage-list">
            {media_cards()}
                </div>
              </div>
            </section>

            <section class="section section-gray">
              <div class="container">
                <div class="section-head narrow">
                  <span>COMPANY NEWS</span>
                  <h2>회사 보도자료</h2>
                  <p>마린하우스코리아 홈페이지에서 제공하는 제품 및 사업 관련 공식 소식입니다.</p>
                </div>
                <div class="press-list">
                  <article class="press-card">
                    <div class="press-meta"><span>신제품 출시</span><time datetime="2026-07-13">2026.07.13</time></div>
                    <h2>마린하우스코리아, 무인 성인인증 키오스크·출입문 관리 시스템 출시</h2>
                    <p>성인인증과 출입문 제어를 하나의 시스템으로 연결한 무인 운영 솔루션을 소개합니다.</p>
                    <a class="press-link" href="press/marinehouse-adult-verification-access-control-launch.html">자세히 보기</a>
                  </article>
                  <article class="press-card">
                    <div class="press-meta"><span>보도자료</span><time datetime="2026-06-10">2026.06.10</time></div>
                    <h2>마린하우스코리아, 무인기기 공급·설치·유지관리 통합 지원 강화</h2>
                    <p>현장 조건에 맞춘 무인기기 도입과 운영 지원 체계를 강화합니다.</p>
                    <a class="press-link" href="press/marinehouse-unmanned-support.html">자세히 보기</a>
                  </article>
                  <article class="press-card">
                    <div class="press-meta"><span>사업소식</span><time datetime="2026-06-10">2026.06.10</time></div>
                    <h2>무인 리테일 시장 대응 위한 아케이드·자동판매 솔루션 라인업 확대</h2>
                    <p>자동판매기, 아케이드 장비, 상품진열장 등 복합형 장비 구성을 확대하고 있습니다.</p>
                    <a class="press-link" href="press/marinehouse-retail-solution-lineup.html">자세히 보기</a>
                  </article>
                  <article class="press-card">
                    <div class="press-meta"><span>회사소개</span><time datetime="2026-06-10">2026.06.10</time></div>
                    <h2>마린하우스코리아, 무인 자동화기기 기반 현장형 운영지원 기업으로 사업 영역 정비</h2>
                    <p>제조 기반의 무인 자동화기기, 자동판매 시스템, 아케이드 장비 사업 방향을 소개합니다.</p>
                    <a class="press-link" href="press/marinehouse-business-area-renewal.html">자세히 보기</a>
                  </article>
                </div>
              </div>
            </section>

            <section class="cta-section">
              <div class="container cta-box">
                <div>
                  <span class="kicker-light">MEDIA & BUSINESS CONTACT</span>
                  <h2>언론·사업·제품 문의는 전화로 안내합니다.</h2>
                  <p>대표번호 또는 고객지원 페이지의 담당 영업팀으로 연락해 주세요.</p>
                </div>
                <a class="btn btn-white" href="support.html">영업팀 연락처 보기</a>
              </div>
            </section>
          </main>'''
              text = re.sub(r'<main id="main">.*?</main>', new_main, text, count=1, flags=re.S)
              text = update_top_strip(text)
              text = update_footer(text)
              if text != original:
                  press_path.write_text(text, encoding='utf-8')
                  if str(press_path) not in changed:
                      changed.append(str(press_path))

          # Update the homepage press preview with the newest verified coverage.
          index_path = ROOT / 'index.html'
          if index_path.exists():
              original = index_path.read_text(encoding='utf-8')
              text = original
              preview = '''<div class="press-list press-preview">
              <article class="press-card">
                <div class="press-meta"><span>호수뉴스</span><time datetime="2026-07-14">2026.07.14</time></div>
                <h3>마린하우스코리아, 성인 전용 무인 매장 출입 관리에 혁신을 가져오다</h3>
                <p>성인인증 키오스크와 출입문 관리 시스템의 작동 방식과 현장 적용 계획을 소개한 기사입니다.</p>
                <a class="press-link" href="https://www.mimint.co.kr/bbs/view/news/S1N12/5477335" target="_blank" rel="noopener noreferrer">기사 원문 보기 ↗</a>
              </article>
              <article class="press-card">
                <div class="press-meta"><span>뉴스와이어</span><time datetime="2026-06-09">2026.06.09</time></div>
                <h3>마린하우스코리아, 무인기기 토탈 솔루션 사업 확대</h3>
                <p>아케이드 게임기와 자동판매기, 무인 리테일 솔루션 사업 확대 소식을 공식 발표했습니다.</p>
                <a class="press-link" href="https://www.newswire.co.kr/newsRead.php?no=1036148" target="_blank" rel="noopener noreferrer">보도자료 원문 보기 ↗</a>
              </article>
            </div>'''
              text = re.sub(
                  r'<div class="press-list press-preview">.*?</div>\s*<div class="press-more-wrap">',
                  preview + '\n            <div class="press-more-wrap">',
                  text,
                  count=1,
                  flags=re.S,
              )
              text = update_top_strip(text)
              text = update_footer(text)
              if text != original:
                  index_path.write_text(text, encoding='utf-8')
                  if str(index_path) not in changed:
                      changed.append(str(index_path))

          # Add responsive sales-team styles once.
          css_path = ROOT / 'assets' / 'css' / 'style.css'
          if css_path.exists():
              original = css_path.read_text(encoding='utf-8')
              marker = '/* SALES TEAM & MEDIA COVERAGE UPDATE */'
              if marker not in original:
                  css = original + '''

          /* SALES TEAM & MEDIA COVERAGE UPDATE */
          .sales-team-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 16px;margin-top:12px}
          .sales-team-list p{margin:0!important;display:flex;gap:8px;align-items:center;justify-content:space-between}
          .sales-team-list strong{color:#fff;font-weight:800;white-space:nowrap}
          .sales-team-list a{white-space:nowrap}
          .sales-team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;margin:2px 0 8px}
          .sales-team-link{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:15px 16px;border:1px solid #d9e3f1;border-radius:16px;background:#f8fbff;transition:.2s ease}
          .sales-team-link:hover{transform:translateY(-2px);border-color:#1458d4;background:#eef5ff}
          .sales-team-link span{font-size:13px;font-weight:800;color:#5b6a7e}
          .sales-team-link strong{font-size:18px;color:#102b52;letter-spacing:-.02em}
          .media-coverage-list .press-card{border-top:3px solid #1557ba}
          .media-coverage-card .press-meta span{background:#edf4ff;color:#0f4eaa}
          @media(max-width:720px){
            .sales-team-list,.sales-team-grid{grid-template-columns:1fr}
            .sales-team-list p{justify-content:flex-start}
            .sales-team-link{align-items:center}
          }
          '''
                  css_path.write_text(css, encoding='utf-8')
                  changed.append(str(css_path))

          # Final audit: old generic mobile label must be gone from the main site and all four sales teams must appear.
          required = {
              '영업1팀': '010-5603-2187',
              '영업2팀': '010-5609-2187',
              '영업3팀': '010-8250-2187',
              '영업4팀': '010-7742-2187',
          }
          support_text = (ROOT / 'support.html').read_text(encoding='utf-8')
          missing = [f'{label} {number}' for label, number in required.items() if label not in support_text or number not in support_text]
          if missing:
              raise SystemExit('Missing sales contacts in support.html: ' + ', '.join(missing))

          press_text = (ROOT / 'press.html').read_text(encoding='utf-8')
          for url in [item['url'] for item in media_items]:
              if url not in press_text:
                  raise SystemExit('Missing media article URL: ' + url)

          print('Changed files:')
          for item in sorted(set(changed)):
              print(' -', item)
          print('\nSales teams:')
          for label, display, _ in SALES:
              print(f' - {label}: {display}')
          print(f'\nMedia coverage cards: {len(media_items)}')
          PY

      - name: Commit final website update
        shell: bash
        run: |
          rm -f .github/workflows/update-sales-teams-and-press.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes were required."
            exit 0
          fi
          git commit -m "Update sales teams and refresh press coverage"
          git push
