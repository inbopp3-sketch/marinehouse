name: SEO validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical pages, structured data, sitemap and links
        run: python3 scripts/seo.py
      - name: Verify installation albums are generated from source
        run: |
          node scripts/render-installation-cases.mjs
          git diff --exit-code -- index.html adult-verification.html cases.html
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/installation-cases.js
