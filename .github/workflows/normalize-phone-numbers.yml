name: Finalize website phone numbers

on:
  push:
    paths:
      - ".github/workflows/normalize-phone-numbers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-phone-numbers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale phone numbers and audit all text pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          TEXT_EXTENSIONS = {'.html', '.htm', '.txt', '.xml', '.js', '.css', '.md', '.json'}

          OFFICE_DISPLAY = '02-744-7779'
          OFFICE_TEL = '027447779'
          MAIN_DISPLAY = '1544-9187'
          MAIN_TEL = '15449187'
          MOBILE_DISPLAY = '010-5609-2187'
          MOBILE_TEL = '01056092187'

          changed = []

          replacements = [
              (r'(?<!\d)032[\s.\-]*361[\s.\-]*7778(?!\d)', OFFICE_DISPLAY),
              (r'(?<!\d)02[\s.\-]*303[\s.\-]*8289(?!\d)', OFFICE_DISPLAY),
              (r'(?<!\d)02[\s.\-]*744[\s.\-]*7779(?!\d)', OFFICE_DISPLAY),
              (r'(?<!\d)1544[\s.\-]*9187(?!\d)', MAIN_DISPLAY),
              (r'(?<!\d)010[\s.\-]*7782[\s.\-]*3840(?!\d)', MOBILE_DISPLAY),
              (r'(?<!\d)010[\s.\-]*8161[\s.\-]*4598(?!\d)', MOBILE_DISPLAY),
              (r'(?<!\d)010[\s.\-]*5609[\s.\-]*2187(?!\d)', MOBILE_DISPLAY),
          ]

          tel_replacements = [
              (r'tel:\s*(?:032[\s.\-]*361[\s.\-]*7778|02[\s.\-]*303[\s.\-]*8289|02[\s.\-]*744[\s.\-]*7779)', f'tel:{OFFICE_TEL}'),
              (r'tel:\s*1544[\s.\-]*9187', f'tel:{MAIN_TEL}'),
              (r'tel:\s*(?:010[\s.\-]*7782[\s.\-]*3840|010[\s.\-]*8161[\s.\-]*4598|010[\s.\-]*5609[\s.\-]*2187)', f'tel:{MOBILE_TEL}'),
          ]

          plain_digit_replacements = {
              '0323617778': OFFICE_TEL,
              '023038289': OFFICE_TEL,
              '027447779': OFFICE_TEL,
              '15449187': MAIN_TEL,
              '01077823840': MOBILE_TEL,
              '01081614598': MOBILE_TEL,
              '01056092187': MOBILE_TEL,
          }

          def normalize(text: str, is_html: bool) -> str:
              for pattern, replacement in tel_replacements:
                  text = re.sub(pattern, replacement, text, flags=re.I)

              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text)

              for old, new in plain_digit_replacements.items():
                  text = text.replace(old, new)

              if is_html:
                  # Normalize the main-site header phone strip.
                  text = re.sub(
                      r'<span>(?=[^<]*(?:회사전화|대표전화|휴대전화))[^<]*(?:02-744-7779|1544-9187|010-5609-2187)[^<]*</span>',
                      '<span>회사전화 02-744-7779 · 대표전화 1544-9187 · 휴대전화 010-5609-2187</span>',
                      text,
                  )

                  # Normalize privacy/contact summaries that previously reused an old office number as the representative number.
                  text = re.sub(
                      r'회사전화\s*:?[ ]*02-744-7779\s*·\s*대표(?:번호|전화)\s*:?\s*02-744-7779',
                      '회사전화: 02-744-7779 · 대표전화: 1544-9187 · 휴대전화: 010-5609-2187',
                      text,
                  )

                  # Keep office, representative and mobile numbers explicit in visible contact blocks.
                  if '<p>대표전화:' in text:
                      lines = text.splitlines()
                      out = []
                      for line in lines:
                          if '<p>대표전화:' in line:
                              recent = '\n'.join(out[-4:])
                              if '회사전화:' not in recent:
                                  indent = line[:len(line) - len(line.lstrip())]
                                  out.append(f'{indent}<p>회사전화: <a href="tel:{OFFICE_TEL}">{OFFICE_DISPLAY}</a></p>')
                          out.append(line)
                      text = '\n'.join(out)

              return text

          for path in ROOT.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in TEXT_EXTENSIONS:
                  continue
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              updated = normalize(original, path.suffix.lower() in {'.html', '.htm'})
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(f' - {item}')

          # Fail the workflow if any stale real contact number remains.
          stale_patterns = {
              '032-361-7778': r'(?<!\d)032[\s.\-]*361[\s.\-]*7778(?!\d)',
              '02-303-8289': r'(?<!\d)02[\s.\-]*303[\s.\-]*8289(?!\d)',
              '010-7782-3840': r'(?<!\d)010[\s.\-]*7782[\s.\-]*3840(?!\d)',
              '010-8161-4598': r'(?<!\d)010[\s.\-]*8161[\s.\-]*4598(?!\d)',
          }

          stale_hits = []
          phone_pattern = re.compile(r'(?<!\d)(?:0\d{1,2}[\s.\-]*\d{3,4}[\s.\-]*\d{4}|1544[\s.\-]*9187)(?!\d)')
          allowed_normalized = {
              '027447779',
              '15449187',
              '01056092187',
              '01000000000',  # Input example placeholder, not a company contact number.
          }
          unexpected = []

          for path in ROOT.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in TEXT_EXTENSIONS:
                  continue
              if '.git' in path.parts or '.github' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              for label, pattern in stale_patterns.items():
                  if re.search(pattern, text):
                      stale_hits.append(f'{path}: {label}')

              for found in phone_pattern.findall(text):
                  normalized = re.sub(r'\D', '', found)
                  if normalized not in allowed_normalized:
                      unexpected.append(f'{path}: {found}')

          if stale_hits or unexpected:
              print('\nStale or unexpected phone numbers remain:')
              for item in sorted(set(stale_hits + unexpected)):
                  print(f' - {item}')
              raise SystemExit(1)

          print('\nAudit passed. Allowed numbers only:')
          print(f' - Company phone: {OFFICE_DISPLAY}')
          print(f' - Representative phone: {MAIN_DISPLAY}')
          print(f' - Mobile phone: {MOBILE_DISPLAY}')
          PY

      - name: Remove temporary workflow and commit final changes
        shell: bash
        run: |
          rm -f .github/workflows/normalize-phone-numbers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes were required."
            exit 0
          fi
          git commit -m "Finalize all website phone numbers"
          git push
