name: Build Club09 Baccarat APK
on:
  push:
    branches:
      - codex/baccarat-apk
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and verify core game
        run: |
          mkdir -p /tmp/baccarat-tests
          javac -d /tmp/baccarat-tests app/src/main/java/com/club09/baccarat/Json.java app/src/main/java/com/club09/baccarat/GameEngine.java app/src/main/java/com/club09/baccarat/LanServer.java tests/EngineTest.java
          java -cp /tmp/baccarat-tests com.club09.baccarat.EngineTest app/src/main/assets
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Club09-Baccarat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Club09-Baccarat-APK
          path: Club09-Baccarat.apk
          if-no-files-found: error
          retention-days: 7
