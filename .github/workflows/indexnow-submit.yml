name: Submit deployed pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'rss.xml'
      - 'llms.txt'
      - 'content/**'
      - 'scripts/indexnow.py'
      - '.github/workflows/indexnow-submit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate before submitting
        if: ${{ hashFiles('maintenance.json') == '' }}
        run: python3 scripts/seo.py
      - name: Wait for exact deployed pages and submit public canonical URLs
        if: ${{ hashFiles('maintenance.json') == '' }}
        run: python3 scripts/indexnow.py
