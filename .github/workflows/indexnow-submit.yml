name: Submit updated pages to IndexNow

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'adult-verification.html'
      - 'about.html'
      - 'products.html'
      - 'business.html'
      - 'press.html'
      - 'support.html'
      - 'location.html'
      - 'press/**.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'fb1a9eebc00bcd84bd4bf2a288b49519.txt'
      - '.github/workflows/indexnow-submit.yml'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify key file
        run: |
          curl --fail --retry 5 --retry-delay 3 https://www.marinehouse.kr/fb1a9eebc00bcd84bd4bf2a288b49519.txt

      - name: Build IndexNow payload
        run: |
          cat > indexnow.json <<'JSON'
          {
            "host": "www.marinehouse.kr",
            "key": "fb1a9eebc00bcd84bd4bf2a288b49519",
            "urlList": [
              "https://www.marinehouse.kr/",
              "https://www.marinehouse.kr/adult-verification.html",
              "https://www.marinehouse.kr/about.html",
              "https://www.marinehouse.kr/products.html",
              "https://www.marinehouse.kr/business.html",
              "https://www.marinehouse.kr/press.html",
              "https://www.marinehouse.kr/support.html",
              "https://www.marinehouse.kr/location.html",
              "https://www.marinehouse.kr/press/marinehouse-unmanned-support.html",
              "https://www.marinehouse.kr/press/marinehouse-retail-solution-lineup.html",
              "https://www.marinehouse.kr/press/marinehouse-business-area-renewal.html",
              "https://www.marinehouse.kr/press/marinehouse-adult-verification-access-control-launch.html"
            ]
          }
          JSON

      - name: Submit all public URLs to Naver IndexNow
        continue-on-error: true
        run: |
          curl --fail-with-body \
            -H 'Content-Type: application/json; charset=utf-8' \
            -X POST 'https://searchadvisor.naver.com/indexnow' \
            --data-binary @indexnow.json

      - name: Submit all public URLs to IndexNow network
        run: |
          curl --fail-with-body \
            -H 'Content-Type: application/json; charset=utf-8' \
            -X POST 'https://api.indexnow.org/indexnow' \
            --data-binary @indexnow.json
