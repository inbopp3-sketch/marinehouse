name: Finish sales contact cleanup

on:
  push:
    paths:
      - ".github/workflows/finish-sales-contact-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove singled-out sales number from landing CTAs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('startup'), Path('1')]
          changed = []

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.html'):
                  original = path.read_text(encoding='utf-8')
                  text = original

                  protected = []
                  def protect(match):
                      block = match.group(0)
                      block = re.sub(r'<div\s+data-sales-teams', '<div id="sales-contacts" data-sales-teams', block, count=1)
                      token = f'__SALES_BLOCK_{len(protected)}__'
                      protected.append(block)
                      return token

                  text = re.sub(r'<div[^>]*data-sales-teams[^>]*>.*?</div>', protect, text, flags=re.S)

                  text = re.sub(r'tel:\s*010[\s.\-]*5609[\s.\-]*2187', 'tel:15449187', text, flags=re.I)
                  text = re.sub(r'(?<!\d)010[\s.\-]*5609[\s.\-]*2187(?!\d)', '1544-9187', text)
                  text = text.replace('상담번호 1544-9187', '대표번호 1544-9187')
                  text = text.replace('휴대전화 1544-9187', '대표전화 1544-9187')
                  text = text.replace('휴대폰 1544-9187', '대표전화 1544-9187')

                  for idx, block in enumerate(protected):
                      text = text.replace(f'__SALES_BLOCK_{idx}__', block)

                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))

          required = [
              ('영업1팀', '010-5603-2187'),
              ('영업2팀', '010-5609-2187'),
              ('영업3팀', '010-8250-2187'),
              ('영업4팀', '010-7742-2187'),
          ]

          for index_path in [Path('startup/index.html'), Path('1/index.html')]:
              if not index_path.exists():
                  continue
              text = index_path.read_text(encoding='utf-8')
              for label, number in required:
                  if label not in text or number not in text:
                      raise SystemExit(f'{index_path}: missing {label} {number}')

              outside = re.sub(r'<div[^>]*data-sales-teams[^>]*>.*?</div>', '', text, flags=re.S)
              if re.search(r'010[\s.\-]*5609[\s.\-]*2187', outside):
                  raise SystemExit(f'{index_path}: team 2 is still used as an unlabeled general contact')

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/finish-sales-contact-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes were required."
            exit 0
          fi
          git commit -m "Finish sales contact cleanup across landing pages"
          git push
